<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique d'Enchantement - Skyrim RP</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at center, rgba(17, 23, 38, 0.85) 0%, rgba(8, 10, 16, 0.95) 70%, #030406 100%),
                        url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1920&q=80') no-repeat center top fixed;
        // Remplacez 'TON_CLIENT_ID_ICI' par votre véritable Client ID Discord Application
        const DISCORD_CLIENT_ID = '1548137913416679495';

        let data = JSON.parse(localStorage.getItem('skyrim_gems_data_v2')) || {
            gold: 1250,
            gems: {
                "Gemme Spirituelle (Vide)": { qty: 15, price: 7 },
                "Gemme Spirituelle (Pleine)": { qty: 10, price: 15 },
            },
            employees: [
                { id: 1, name: "Farengar", role: "Mage de cour", salary: 150 }
            ],
            users: {}
        };

        let currentUser = null;

        function loginWithDiscord() {
            if (DISCORD_CLIENT_ID === '1548137913416679495') {
                alert("Erreur : Le CLIENT_ID Discord n'est pas renseigné dans le code JavaScript.");
                return;
            }
            const redirectUri = encodeURIComponent(window.location.origin + window.location.pathname);
            const discordUrl = `https://discord.com/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${redirectUri}&response_type=token&scope=identify`;
            window.location.href = discordUrl;
        }

        function handleDiscordAuth() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const accessToken = params.get('access_token');

            if (accessToken) {
                fetch('https://discord.com/api/users/@me', {
                    headers: { authorization: `Bearer ${accessToken}` }
                })
                .then(res => res.json())
                .then(user => {
                    if (user.id) {
                        localStorage.setItem('discord_user', JSON.stringify(user));
                        window.history.replaceState({}, document.title, window.location.pathname);
                        registerUser(user);
                    }
                })
                .catch(err => {
                    console.error("Erreur d'authentification Discord:", err);
                    renderAuth(null);
                });
            } else {
                const savedUser = JSON.parse(localStorage.getItem('discord_user'));
                if (savedUser) registerUser(savedUser);
                else renderAuth(null);
            }
        }

        function registerUser(user) {
            currentUser = user;

            if (!data.users[user.id]) {
                data.users[user.id] = {
                    id: user.id,
                    username: user.username,
                    avatar: user.avatar,
                    totalSales: 0
                };
            } else {
                data.users[user.id].username = user.username;
                data.users[user.id].avatar = user.avatar;
            }

            renderAuth(user);
            saveAndRender();
        }

        function renderAuth(user) {
            const container = document.getElementById('auth-container');
            const salesCard = document.getElementById('user-sales-card');

            if (user && currentUser) {
                const avatarUrl = user.avatar 
                    ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png` 
                    : 'https://cdn.discordapp.com/embed/avatars/0.png';
                container.innerHTML = `
                    <div class="user-profile">
                        <img class="user-avatar" src="${avatarUrl}" alt="Avatar">
                        <span>${user.username}</span>
                        <button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.8em;" onclick="logout()">Déconnexion</button>
                    </div>
                `;
                salesCard.style.display = 'block';
            } else {
                container.innerHTML = `
                    <button onclick="loginWithDiscord()" class="btn-discord">
                        <span>Se connecter avec Discord</span>
                    </button>
                `;
                salesCard.style.display = 'none';
            }
        }

        function logout() {
            localStorage.removeItem('discord_user');
            currentUser = null;
            renderAuth(null);
            saveAndRender();
        }

        function submitSale() {
            if (!currentUser) return;

            const amount = Math.max(0, parseInt(document.getElementById('sale-amount').value) || 0);

            if (amount > 0) {
                data.gold += amount;
                data.users[currentUser.id].totalSales += amount;
                
                document.getElementById('sale-description').value = '';
                document.getElementById('sale-amount').value = '';
                
                saveAndRender();
            }
        }

        function removeUser(userId) {
            if (confirm("Voulez-vous vraiment supprimer cet utilisateur ?")) {
                delete data.users[userId];
                if (currentUser && currentUser.id === userId) {
                    logout();
                } else {
                    saveAndRender();
                }
            }
        }

        function saveAndRender() {
            localStorage.setItem('skyrim_gems_data_v2', JSON.stringify(data));
            document.getElementById('gold-balance').innerText = data.gold.toLocaleString();

            // Stock Gemmes
            const list = document.getElementById('inventory-list');
            list.innerHTML = '';
            let totalStockValue = 0;

            for (const [name, info] of Object.entries(data.gems)) {
                const totalValue = info.qty * info.price;
                totalStockValue += totalValue;

                list.innerHTML += `
                    <tr>
                        <td>${name}</td>
                        <td class="right">${info.price} septims</td>
                        <td class="right">${info.qty}</td>
                        <td class="right">${totalValue.toLocaleString()} septims</td>
                    </tr>
                `;
            }
            document.getElementById('stock-value').innerText = totalStockValue.toLocaleString();

            // Utilisateurs Discord
            const usersList = document.getElementById('users-list');
            usersList.innerHTML = '';

            Object.values(data.users).forEach(u => {
                const avatarUrl = u.avatar 
                    ? `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png` 
                    : 'https://cdn.discordapp.com/embed/avatars/0.png';
                
                usersList.innerHTML += `
                    <tr>
                        <td>
                            <div class="user-cell">
                                <img class="mini-avatar" src="${avatarUrl}" alt="">
                                <span>${u.username}</span>
                            </div>
                        </td>
                        <td class="right">${u.totalSales.toLocaleString()} septims</td>
                        <td class="right">
                            <button class="btn btn-danger" onclick="removeUser('${u.id}')">Supprimer</button>
                        </td>
                    </tr>
                `;
            });

            // Employés RP
            const empList = document.getElementById('employee-list');
            empList.innerHTML = '';
            if (!data.employees) data.employees = [];

            data.employees.forEach(emp => {
                empList.innerHTML += `
                    <tr>
                        <td><strong>${emp.name}</strong></td>
                        <td>${emp.role}</td>
                        <td class="right">${emp.salary} septims</td>
                        <td class="right">
                            <button class="btn" onclick="payEmployee(${emp.id}, ${emp.salary})">Payer</button>
                            <button class="btn btn-danger" onclick="removeEmployee(${emp.id})">Renvoyer</button>
                        </td>
                    </tr>
                `;
            });
        }

        function modifyGold(direction) {
            const qty = Math.max(0, parseInt(document.getElementById('gold-qty').value) || 0);
            data.gold = Math.max(0, data.gold + (qty * direction));
            saveAndRender();
        }

        function modifyGem(direction) {
            const name = document.getElementById('gem-select').value;
            const qty = Math.max(0, parseInt(document.getElementById('gem-qty').value) || 0);
            if (data.gems[name] !== undefined) {
                data.gems[name].qty = Math.max(0, data.gems[name].qty + (qty * direction));
                saveAndRender();
            }
        }

        function addEmployee() {
            const name = document.getElementById('emp-name').value.trim();
            const role = document.getElementById('emp-role').value.trim() || 'Employé';
            const salary = Math.max(0, parseInt(document.getElementById('emp-salary').value) || 0);

            if (name) {
                data.employees.push({ id: Date.now(), name, role, salary });
                document.getElementById('emp-name').value = '';
                document.getElementById('emp-role').value = '';
                document.getElementById('emp-salary').value = '';
                saveAndRender();
            }
        }

        function removeEmployee(id) {
            data.employees = data.employees.filter(emp => emp.id !== id);
            saveAndRender();
        }

        function payEmployee(id, salary) {
            if (data.gold >= salary) {
                data.gold -= salary;
                saveAndRender();
            } else {
                alert("Pas assez d'or en caisse pour verser le salaire !");
            }
        }

        handleDiscordAuth();
        saveAndRender();
    </script>
</body>
</html>
