<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique d'Enchantement - Skyrim RP</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at center, #111726 0%, #080a10 70%, #030406 100%),
                        url('watermarked_img_15139461399379977025.png') no-repeat center top fixed;
            background-size: cover;
            color: #d1d5db;
            font-family: 'Cinzel', 'Georgia', 'Segoe UI', serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Bar & Auth */
        .auth-bar {
            width: 100%;
            max-width: 750px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.9);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(135, 206, 235, 0.3);
        }
        .user-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid #87ceeb;
        }
        .btn-discord {
            background: #5865F2;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .btn-discord:hover {
            background: #4752C4;
        }

        /* Logo & Header */
        .header-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        .btn-danger {
            border-color: rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #fff;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        th { color: #94a3b8; font-size: 0.9em; text-transform: uppercase; }
        td.right, th.right { text-align: right; }
        tr:hover td { background: rgba(255, 255, 255, 0.03); }
    </style>
</head>
<body>

    <div class="auth-bar">
        <div id="auth-container">
            <a id="discord-login-btn" href="#" class="btn-discord">
                <span>Se connecter avec Discord</span>
            </a>
        </div>
    </div>

        <h2>Gestion des Employés</h2>
        <div class="action-inputs">
            <input type="text" id="emp-name" placeholder="Nom du registre / RP">
            <input type="text" id="emp-role" placeholder="Rôle (ex: Enchanteur)">
            <input type="number" id="emp-salary" placeholder="Salaire (septims)" min="0">
            <button class="btn" onclick="addEmployee()">+ Recruter</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Employé</th>
                    <th>Rôle</th>
                    <th class="right">Salaire</th>
                    <th class="right">Actions</th>
                </tr>
            </thead>
            <tbody id="employee-list"></tbody>
        </table>
    </div>

    <script>
        // CONFIGURATION DISCORD (Remplace CLIENT_ID par ton ID d'application Discord)
        const DISCORD_CLIENT_ID = 'TON_CLIENT_ID_ICI'; 
        const REDIRECT_URI = window.location.href.split('#')[0];
        const DISCORD_AUTH_URL = `https://discord.com/api/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;

        document.getElementById('discord-login-btn').href = DISCORD_AUTH_URL;

        // Gestion de la sauvegarde locale
        let data = JSON.parse(localStorage.getItem('skyrim_enchant_data_simple')) || {
            gold: 1250,
            gems: {
                "Gemme Spirituelle (Vide)": { qty: 10, price: 7 },
                "Gemme Spirituelle (Pleine)": { qty: 5, price: 15 }
        function saveAndRender() {
            localStorage.setItem('skyrim_enchant_data_simple', JSON.stringify(data));
            document.getElementById('gold-balance').innerText = data.gold.toLocaleString();

            // Rendu Inventaire
            const list = document.getElementById('inventory-list');
            list.innerHTML = '';
            let totalStockValue = 0;

            for (const [name, info] of Object.entries(data.gems)) {
                const totalValue = info.qty * info.price;
                totalStockValue += totalValue;

                list.innerHTML += `
                    <tr>
                        <td>${name}</td>
                        <td class="right">${info.price} septims</td>
                        <td class="right">${info.qty}</td>
                        <td class="right">${totalValue.toLocaleString()} septims</td>
                    </tr>
                `;
            }
            document.getElementById('stock-value').innerText = totalStockValue.toLocaleString();

            // Rendu Employés
            const empList = document.getElementById('employee-list');
            empList.innerHTML = '';
            if (!data.employees) data.employees = [];

            data.employees.forEach(emp => {
                empList.innerHTML += `
                    <tr>
                        <td><strong>${emp.name}</strong></td>
                        <td>${emp.role}</td>
                        <td class="right">${emp.salary} septims</td>
                        <td class="right">
                            <button class="btn" onclick="payEmployee(${emp.id}, ${emp.salary})">Payer</button>
                            <button class="btn btn-danger" onclick="removeEmployee(${emp.id})">Renvoyer</button>
                        </td>
                    </tr>
                `;
            });
        }

        function modifyGold(direction) {
            const qty = parseInt(document.getElementById('gold-qty').value) || 0;
            data.gold = Math.max(0, data.gold + (qty * direction));
            saveAndRender();
        }

        function modifyGem(direction) {
            const name = document.getElementById('gem-select').value;
            const qty = parseInt(document.getElementById('gem-qty').value) || 0;
            if (data.gems[name] !== undefined) {
                data.gems[name].qty = Math.max(0, data.gems[name].qty + (qty * direction));
                saveAndRender();
            }
        }

        function addEmployee() {
            const name = document.getElementById('emp-name').value.trim();
            const role = document.getElementById('emp-role').value.trim() || 'Employé';
            const salary = parseInt(document.getElementById('emp-salary').value) || 0;

            if (name) {
                data.employees.push({ id: Date.now(), name, role, salary });
                document.getElementById('emp-name').value = '';
                document.getElementById('emp-role').value = '';
                document.getElementById('emp-salary').value = '';
                saveAndRender();
            }
        }

        function removeEmployee(id) {
            data.employees = data.employees.filter(emp => emp.id !== id);
            saveAndRender();
        }

        function payEmployee(id, salary) {
            if (data.gold >= salary) {
                data.gold -= salary;
                saveAndRender();
            } else {
                alert("Pas assez d'or en caisse pour verser le salaire !");
            }
        }

        handleDiscordAuth();
        saveAndRender();
    </script>
</body>
</html>
