<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compagnie Minière - Skyrim RP</title>
    <style>
        body {
            background-color: #1a1e29;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        nav {
            display: flex;
            gap: 20px;
            background: #252a38;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        nav button {
            background: none;
            border: none;
            color: #ccc;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        nav button:hover { color: #fff; }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            text-align: center;
        }
        .balance-box {
            font-size: 1.2em;
            margin-bottom: 15px;
        }
        .btn {
            background: #e0e0e0;
            color: #1a1e29;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }
        .btn:hover { background: #ffffff; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        th { color: #aaa; }
        td:last-child { text-align: right; }
        .action-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }
        input, select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #252a38;
            color: white;
        }
    </style>
</head>
<body>

    <nav>
        <button>Tarifs</button>
        <button>Stocks</button>
        <button>Devis</button>
        <button>Commander</button>
    </nav>

    <div class="balance-box">
        Dû par la Compagnie Minière : <strong id="gold-balance">0</strong> septims
    </div>

    <div class="card">
        <h2>Pioches</h2>
        <p>Stock de la compagnie : <strong id="pickaxe-stock">58</strong></p>
        <button class="btn" onclick="changeStock('pickaxe', -1)">⬇ Prendre</button>
        <button class="btn" onclick="changeStock('pickaxe', 1)">⬆ Déposer</button>
    </div>

    <div class="card">
        <h2>Mon tonneau (Minerais)</h2>
        <div class="action-inputs">
            <select id="resource-select">
                <option value="Fer">Fer</option>
                <option value="Corindon">Corindon</option>
                <option value="Argent">Argent</option>
                <option value="Or">Or</option>
                <option value="Orichalque">Orichalque</option>
                <option value="Pierre de Lune">Pierre de Lune</option>
                <option value="Vif-Argent">Vif-Argent</option>
            </select>
            <input type="number" id="resource-qty" value="10" min="1">
            <button class="btn" onclick="modifyResource(1)">Déposer</button>
            <button class="btn" onclick="modifyResource(-1)">Retirer</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Minerai</th>
                    <th style="text-align: right;">Quantité</th>
                </tr>
            </thead>
            <tbody id="inventory-list"></tbody>
        </table>
    </div>

    <script>
        let data = JSON.parse(localStorage.getItem('skyrim_mine_data')) || {
            gold: 515.10,
            pickaxes: 58,
            items: {
                "Fer": 514,
                "Corindon": 237,
                "Argent": 221,
                "Or": 573,
                "Orichalque": 19,
                "Pierre de Lune": 13,
                "Vif-Argent": 11
            }
        };

        function saveAndRender() {
            localStorage.setItem('skyrim_mine_data', JSON.stringify(data));
            document.getElementById('gold-balance').innerText = data.gold.toFixed(2);
            document.getElementById('pickaxe-stock').innerText = data.pickaxes;

            const list = document.getElementById('inventory-list');
            list.innerHTML = '';
            for (const [name, qty] of Object.entries(data.items)) {
                list.innerHTML += `<tr><td>${name}</td><td>${qty}</td></tr>`;
            }
        }

        function changeStock(type, amount) {
            if (type === 'pickaxe') {
                data.pickaxes = Math.max(0, data.pickaxes + amount);
            }
            saveAndRender();
        }

        function modifyResource(direction) {
            const name = document.getElementById('resource-select').value;
            const qty = parseInt(document.getElementById('resource-qty').value) || 0;
            if (data.items[name] !== undefined) {
                data.items[name] = Math.max(0, data.items[name] + (qty * direction));
                saveAndRender();
            }
        }

        saveAndRender();
    </script>
</body>
</html>
